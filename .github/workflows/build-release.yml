name: Build Desktop Release (Windows Setup.exe)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Promote UI strings from Firestore (if secret configured)
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/promote-ui-strings.mjs --platform desktop


      - name: Build client & typecheck
        run: npm run build

      - name: Bundle Electron main & preload
        run: npm run build:electron

      - name: Build Setup.exe artifact (manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: npx electron-builder --win nsis --publish never

      - name: Build Windows NSIS installer (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --win nsis --publish never

      - name: Extract Current Version Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/extract-release-notes.mjs

      - name: Publish Single GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          body_path: release/CURRENT_RELEASE_NOTES.md
          generate_release_notes: true

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otzar-Sefarim-Windows-Setup
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error