name: Build Desktop Release (Windows Setup.exe)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build client & typecheck
        run: npm run build

      - name: Bundle Electron main & preload
        run: npm run build:electron

      - name: Build Setup.exe artifact (manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') == false
        run: npx electron-builder --win nsis --publish never

      - name: Build & Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Otzar-Sefarim-Windows-Setup
          path: |
            release/*.exe
            release/latest.yml
            release/*.blockmap
          if-no-files-found: error